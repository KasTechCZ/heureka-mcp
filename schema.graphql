type ProductParamForPreview {
  description: String
  text: String!
}

type QCEntity {
  name: String!
  total: Total!
}

type Query {
  serp(body: SerpRequestBody!, country: CountryCode!): SerpResponse!
}

type QueryContext {
  entities: [QCEntity!]!
}

input RangeFilterInput {
  keyId: Int!
  rangeValue: FilterRangeInput!
}

enum RedirectObjectType {
  category
  serp
  shop
  brand
  product
  url
  corrector
}

type RedirectToObject {
  type: RedirectObjectType!
  originalQuery: String!
  orderBy: OrderBy!
  id: Int
  uuid: String
  slug: String
  categorySlug: String
  name: String
  url: String
  query: String
  filterString: String
}

input SerpRequestBody {
  query: String = null
  productIds: [String!] = null
  productUuids: [String!] = null
  filterString: String = null
  filters: FiltersInput = null
  orderBy: OrderBy! = not_specified
  offset: Int! = 0
  limit: Int! = 24
  page: Int = null
  pageSize: Int = null
  ignoreCache: Boolean! = false
}

type SerpResponse {
  queryContext: QueryContext!
  aiAdvisor: AIAdvisor
  aiQuestions: [String!]!
  deciderResult: String!
  product: [Product!]!
  availableFilters: AvailableFilters!
  productAds: [ProductAd!]!
  subcategories: [Subcategory!]!
  correctedQuery: CorrectedQuery!
  offers: [Offer!]!
  shops: [Shop!]!
  producers: [Producer!]!
  productAdvisors: [Product!]!
  queryRedirect: [RedirectToObject!]!
  productLine: [ProductLine!]!
  productsAndLines: [ProductOrLine!]!
}

type Shop {
  id: String!
  uuid: String
  name: String!
  slug: String!
  url: String
  imageUrl: String
  images: [Image!]
  recommendationsPct: Int
  reviewCount: Int!
  ozCertificate: ShopOZCertificate
  type: String!
}

enum ShopOZCertificate {
  blue
  gold
}

type Subcategory {
  id: String!
  uuid: String
  slug: String!
  name: String!
  parentId: String
  parentUuid: String
  isLast: Boolean!
  productCount: Int
  type: CategoryTypeEnum!
  filterString: String
  imageUrl: String
  imageUuid: String
  images: [Image!]
  rank: Int
  restricted: Boolean!
  exactMatch: Boolean
  contentPreferredLayout: CategoryPreferredLayoutEnum
}

type Total {
  value: Int!
  relation: String!
}

input TypeFilterInput {
  filterKey: FilterKeys!
  boolValue: Boolean = null
  stringValue: String = null
  numberValue: Float = null
  idValues: [Int!] = null
}

