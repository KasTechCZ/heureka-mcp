"""Exposes a URL that specifies the behavior of this scalar."""
directive @specifiedBy(
  """The URL that specifies the behavior of this scalar."""
  url: String!
) on SCALAR

directive @context on FIELD

type AIAdvisor {
  query: String!
  blocks: [AiAdvisorBlockItem!]!
}

union AiAdvisorBlockItem = AiAdvisorTitleBlock | AiAdvisorParagraphBlock | AiRecommendedProductsBlock | AiAdvisorBulletlistBlock

type AiAdvisorBulletlistBlock {
  items: [String!]!
}

type AiAdvisorParagraphBlock {
  text: String!
}

type AiAdvisorTitleBlock {
  text: String!
}

type AiRecommendedProductsBlock {
  productIds: [String!]!
  product: [Product!]!
}

type AvailableFilters {
  priceIds: [PriceFilterOption!]
  priceRanges: [PriceRangeFilterOption!]
  attributes: [Filter!]!
  onlyInStock: [InStockFilterOption!]
  reviewRating: [FilterOption!]!
  priceDrop: [PriceDropFilterOption!]
  blackFriday: [BlackFridayFilterOption!]
  brand: [BrandsFilter!]!
}

type BlackFridayFilterOption {
  id: String!
  count: Int
  active: Boolean
}

type BrandsFilter {
  id: Int!
  name: String!
  count: Int!
  order: Int!
  active: Boolean
  min: Float
  max: Float
}

enum CategoryPreferredLayoutEnum {
  rows
  grid
}

enum CategoryTypeEnum {
  category
  attribute_category
  redirect_category
}

type CorrectedQuery {
  categorySlug: String
  filterString: String
  orderBy: OrderBy
  correctorResult: String
}

enum CountryCode {
  cz
  sk
  bg
}

enum DisplayTypeEnum {
  THUMBNAILS
  BUTTONS
}

enum EnergyLabelValuesExtended {
  Appp
  App
  Ap
  A
  B
  C
  D
  E
  F
  G
}

type EnergyParam {
  paramName: String!
  valueName: EnergyLabelValuesExtended!
  order: Int!
  color: EnergyParamColor!
  firstLetter: String!
  lastLetter: String!
}

enum EnergyParamColor {
  COLORED
  BLUE
}

type EnergyRangeType {
  color: FilterRangeColorType!
  firstLetter: String!
  lastLetter: String!
}

type Filter {
  id: String!
  name: String!
  order: Int!
  unit: String
  valueType: FilterAttributeValueType!
  values: [FilterOption!]!
  description: String
  showOnlyUpperLimit: Boolean!
  showOnlyLowerLimit: Boolean!
  status: FilterStatus!
  energyRangeType: EnergyRangeType
}

enum FilterAttributeValueType {
  string
  number
  numerical01
  numerical02
  numerical03
  numerical04
  numerical05
  bool
  palette
}

enum FilterKeys {
  price_ids
  price_min
  price_max
  only_in_stock
  review_rating
  product_status
  brand
  price_drop
  black_friday
}

type FilterOption {
  id: Float
  count: Int!
  order: Int!
  name: String
  code: String
  min: Float
  max: Float
  active: Boolean
}

enum FilterRangeColorType {
  BLUE
  COLORED
}

input FilterRangeInput {
  min: Float = null
  max: Float = null
}

input FiltersInput {
  idsFilters: [IdsFilterInput!]
  typeFilters: [TypeFilterInput!]
  rangeFilters: [RangeFilterInput!]
}

type FilterStatus {
  filter: Boolean!
  offerValues: Boolean!
  search: Boolean!
  distributionParam: Boolean!
  mustConfirmValues: Boolean!
  useItemGroupId: Boolean!
  specification: Boolean!
  filterDetail: Boolean!
  subAttribute: Boolean!
  noIntervals: Boolean!
}

input IdsFilterInput {
  keyId: String!
  ids: [String!]!
}

type Image {
