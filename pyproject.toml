[project]
name = "heureka-mcp"
version = "0.1.0"
description = "Heureka.cz MCP server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp<3.0.0",
    "httpx>=0.27.0",
    "gql[httpx]>=3.5.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.10",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
